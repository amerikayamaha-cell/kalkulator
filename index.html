<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #edf1f7;
      font-family: system-ui, sans-serif;
    }
    .calculator {
      width: min(360px, calc(100vw - 32px));
      padding: 22px;
      border-radius: 24px;
      background: #18212f;
      box-shadow: 0 20px 50px #1520333d;
    }
    .display {
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 12px 8px 20px;
      color: white;
      text-align: right;
    }
    .previous { min-height: 28px; color: #aab4c4; font-size: 18px; }
    .current {
      width: 100%;
      overflow: hidden;
      font-size: clamp(36px, 12vw, 52px);
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    button {
      min-height: 64px;
      border: 0;
      border-radius: 18px;
      background: #283446;
      color: white;
      font: inherit;
      font-size: 22px;
      cursor: pointer;
      transition: filter 0.15s, transform 0.08s;
    }
    button:hover { filter: brightness(1.2); }
    button:active { transform: scale(0.96); }
    button.utility { background: #3a485c; }
    button.operator { background: #ff9f43; color: #18212f; font-weight: 700; }
    button.equals { background: #61d095; color: #10251a; font-weight: 700; }
    button.zero { grid-column: span 2; }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Kalkulator">
    <section class="display" aria-live="polite">
      <div class="previous" id="previous"></div>
      <div class="current" id="current">0</div>
    </section>
    <section class="buttons">
      <button class="utility" data-action="clear">AC</button>
      <button class="utility" data-action="sign">±</button>
      <button class="utility" data-action="percent">%</button>
      <button class="operator" data-operator="÷">÷</button>
      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-operator="×">×</button>
      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-operator="−">−</button>
      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="operator" data-operator="+">+</button>
      <button class="utility" data-action="delete">⌫</button>
      <button class="zero" data-digit="0">0</button>
      <button data-action="decimal">.</button>
      <button class="equals" data-action="equals">=</button>
    </section>
  </main>
  <script>
    const currentDisplay = document.getElementById("current");
    const previousDisplay = document.getElementById("previous");
    let currentValue = "0";
    let storedValue = null;
    let selectedOperator = null;
    let shouldStartNewNumber = false;

    function updateDisplay() { currentDisplay.textContent = currentValue; }

    function enterDigit(digit) {
      if (currentValue === "Error" || shouldStartNewNumber) {
        currentValue = digit;
        shouldStartNewNumber = false;
      } else {
        currentValue = currentValue === "0" ? digit : currentValue + digit;
      }
      updateDisplay();
    }

    function enterDecimal() {
      if (currentValue === "Error" || shouldStartNewNumber) {
        currentValue = "0.";
        shouldStartNewNumber = false;
      } else if (!currentValue.includes(".")) {
        currentValue += ".";
      }
      updateDisplay();
    }

    function calculate(a, operator, b) {
      if (operator === "+") return a + b;
      if (operator === "−") return a - b;
      if (operator === "×") return a * b;
      if (operator === "÷") return b === 0 ? NaN : a / b;
      return b;
    }

    function formatResult(number) {
      if (!Number.isFinite(number)) return "Error";
      return String(Number(number.toPrecision(12)));
    }

    function chooseOperator(operator) {
      if (currentValue === "Error") return;
      const inputValue = Number(currentValue);
      if (selectedOperator && !shouldStartNewNumber) {
        const result = calculate(storedValue, selectedOperator, inputValue);
        currentValue = formatResult(result);
        storedValue = result;
        updateDisplay();
      } else {
        storedValue = inputValue;
      }
      selectedOperator = operator;
      previousDisplay.textContent = `${currentValue} ${operator}`;
      shouldStartNewNumber = true;
    }

    function showResult() {
      if (!selectedOperator || storedValue === null || currentValue === "Error") return;
      const result = calculate(storedValue, selectedOperator, Number(currentValue));
      previousDisplay.textContent = `${storedValue} ${selectedOperator} ${currentValue} =`;
      currentValue = formatResult(result);
      storedValue = null;
      selectedOperator = null;
      shouldStartNewNumber = true;
      updateDisplay();
    }

    function clearCalculator() {
      currentValue = "0";
      storedValue = null;
      selectedOperator = null;
      shouldStartNewNumber = false;
      previousDisplay.textContent = "";
      updateDisplay();
    }

    function deleteDigit() {
      if (currentValue === "Error" || shouldStartNewNumber) {
        currentValue = "0";
        shouldStartNewNumber = false;
      } else {
        currentValue = currentValue.length > 1 ? currentValue.slice(0, -1) : "0";
        if (currentValue === "-") currentValue = "0";
      }
      updateDisplay();
    }

    function changeSign() {
      if (currentValue !== "Error") {
        currentValue = String(Number(currentValue) * -1);
        updateDisplay();
      }
    }

    function convertToPercent() {
      if (currentValue !== "Error") {
        currentValue = formatResult(Number(currentValue) / 100);
        updateDisplay();
      }
    }

    document.querySelector(".buttons").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
      if (button.dataset.operator) chooseOperator(button.dataset.operator);
      const action = button.dataset.action;
      if (action === "clear") clearCalculator();
      if (action === "delete") deleteDigit();
      if (action === "decimal") enterDecimal();
      if (action === "sign") changeSign();
      if (action === "percent") convertToPercent();
      if (action === "equals") showResult();
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9]$/.test(event.key)) enterDigit(event.key);
      else if (event.key === ".") enterDecimal();
      else if (event.key === "Enter" || event.key === "=") showResult();
      else if (event.key === "Backspace") deleteDigit();
      else if (event.key === "Escape") clearCalculator();
      else if (event.key === "+") chooseOperator("+");
      else if (event.key === "-") chooseOperator("−");
      else if (event.key === "*") chooseOperator("×");
      else if (event.key === "/") { event.preventDefault(); chooseOperator("÷"); }
    });
  </script>
</body>
</html>
